<div class="min-h-screen w-full flex items-center justify-center bg-gray-100 px-4 py-10">
  <div class="w-full max-w-md">

    <!-- Brand -->
    <div class="flex flex-col items-center mb-6">
      <div class="h-12 w-12 rounded-xl bg-gray-800 flex items-center justify-center shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9.75h16.5M3.75 14.25h16.5M9 4.5v15m6-15v15M5.25 4.5h13.5A1.5 1.5 0 0120.25 6v12a1.5 1.5 0 01-1.5 1.5H5.25a1.5 1.5 0 01-1.5-1.5V6a1.5 1.5 0 011.5-1.5z" />
        </svg>
      </div>
      <h1 class="mt-4 text-2xl font-semibold text-gray-900">Welcome back</h1>
      <p class="mt-1 text-sm text-gray-500">Sign in to Order Management System</p>
    </div>

    <!-- Card -->
    <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-6 sm:p-8">

      <!-- Server error -->
      <div
        *ngIf="loginError()"
        class="mb-5 flex items-start gap-2 rounded-lg bg-red-50 border border-red-200 px-3 py-2.5 text-sm text-red-700"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0 3.75h.008v.008H12v-.008zM21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ loginError() }}</span>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate class="space-y-5">

        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email address</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0-.414.336-.75.75-.75h18c.414 0 .75.336.75.75v10.5a.75.75 0 01-.75.75H3a.75.75 0 01-.75-.75V6.75z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 7l9 6 9-6" />
              </svg>
            </span>
            <input
              id="email"
              type="email"
              formControlName="email"
              autocomplete="email"
              placeholder="you@example.com"
              class="w-full rounded-lg border bg-gray-50 pl-10 pr-3 py-2.5 text-sm text-gray-900 placeholder-gray-400
                     focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-gray-800 transition
                     disabled:opacity-60"
              [class.border-gray-300]="!(email?.invalid && email?.touched)"
              [class.border-red-400]="email?.invalid && email?.touched"
              [attr.aria-invalid]="email?.invalid && email?.touched"
            />
          </div>
          <p *ngIf="email?.invalid && email?.touched" class="mt-1.5 text-xs text-red-600">
            {{ emailErrorMessage() }}
          </p>
        </div>

        <!-- Password -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <button
              type="button"
              (click)="goToForgotPassword()"
              class="text-xs cursor-pointer font-medium text-gray-600 hover:text-gray-900 transition"
            >
              Forgot password?
            </button>
          </div>

          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
              </svg>
            </span>

            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              class="w-full rounded-lg border bg-gray-50 pl-10 pr-10 py-2.5 text-sm text-gray-900 placeholder-gray-400
                     focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-gray-800 transition
                     disabled:opacity-60"
              [class.border-gray-300]="!(password?.invalid && password?.touched)"
              [class.border-red-400]="password?.invalid && password?.touched"
              [attr.aria-invalid]="password?.invalid && password?.touched"
            />

            <!-- Eye toggle -->
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-700 transition"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            >
              <svg *ngIf="!showPassword()" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <svg *ngIf="showPassword()" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12c1.292 4.338 5.31 7.5 10.066 7.5a10.45 10.45 0 004.294-.916m3.51-2.877A10.49 10.49 0 0022.066 12c-1.292-4.338-5.31-7.5-10.066-7.5a10.523 10.523 0 00-3.07.443" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M9.88 9.88a3 3 0 104.24 4.24" />
              </svg>
            </button>
          </div>
          <p *ngIf="password?.invalid && password?.touched" class="mt-1.5 text-xs text-red-600">
            {{ passwordErrorMessage() }}
          </p>
        </div>

        <!-- Remember me -->
        <div class="flex items-center justify-between">
          <label class="inline-flex items-center gap-2 cursor-pointer select-none">
            <input
              type="checkbox"
              [checked]="rememberMe()"
              (change)="toggleRememberMe()"
              class="h-4 w-4 rounded border-gray-300 text-gray-800 focus:ring-gray-800 accent-gray-800"
            />
            <span class="text-sm text-gray-600">Remember me</span>
          </label>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="isSubmitting()"
          class="w-full flex items-center cursor-pointer justify-center gap-2 rounded-lg bg-gray-800 py-2.5 text-sm font-semibold text-white
                 hover:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-800 focus:ring-offset-2
                 disabled:opacity-60 disabled:cursor-not-allowed transition"
        >
          <svg *ngIf="isSubmitting()" class="h-4 w-4 animate-spin text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          <span>{{ isSubmitting() ? 'Logging in…' : 'Log in' }}</span>
        </button>
      </form>

      <!-- Divider -->
      <div class="flex items-center gap-3 my-6">
        <div class="h-px flex-1 bg-gray-200"></div>
        <span class="text-xs text-gray-400">or</span>
        <div class="h-px flex-1 bg-gray-200"></div>
      </div>

      <p class="text-center text-sm text-gray-500">
        Don't have an account?
        <a routerLink="/register" class="font-medium text-gray-800 hover:text-gray-900">Create Your Account</a>
      </p>
    </div>

    <p class="mt-6 text-center text-xs text-gray-400">
      © {{ 2026 }} Areena Design OMS. All rights reserved.
    </p>
  </div>
</div>
