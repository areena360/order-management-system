<div class="min-h-screen w-full flex items-center justify-center bg-gray-100 px-4 py-10">
  <div class="w-full max-w-md">

    <div class="flex flex-col items-center mb-6">
      <div class="h-12 w-12 rounded-xl bg-gray-800 flex items-center justify-center shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
        </svg>
      </div>
      <h1 class="mt-4 text-2xl font-semibold text-gray-900">Forgot your password?</h1>
      <p class="mt-1 text-sm text-gray-500 text-center">
        Enter your email and we'll send you a link to reset it.
      </p>
    </div>

    <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-6 sm:p-8">

      <!-- Success state -->
      <div *ngIf="emailSent()" class="text-center py-4">
        <div class="mx-auto h-12 w-12 rounded-full bg-green-50 flex items-center justify-center mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
          </svg>
        </div>
        <h2 class="text-base font-semibold text-gray-900">Check your inbox</h2>
        <p class="mt-1.5 text-sm text-gray-500">
          If an account exists for that email, a reset link is on its way. It's valid for 30 minutes.
        </p>
        <a routerLink="/login" class="mt-5 inline-block text-sm font-medium text-gray-800 hover:text-gray-900">
          ← Back to sign in
        </a>
      </div>

      <!-- Form state -->
      <form *ngIf="!emailSent()" [formGroup]="forgotForm" (ngSubmit)="onSubmit()" novalidate class="space-y-5">

        <div *ngIf="errorMessage()" class="rounded-lg bg-red-50 border border-red-200 px-3 py-2.5 text-sm text-red-700">
          {{ errorMessage() }}
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email address</label>
          <input
            id="email" type="email" formControlName="email" placeholder="you@example.com" autocomplete="email"
            class="w-full rounded-lg border bg-gray-50 px-3 py-2.5 text-sm text-gray-900 placeholder-gray-400
                   focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-gray-800 transition"
            [class.border-gray-300]="!(email?.invalid && email?.touched)"
            [class.border-red-400]="email?.invalid && email?.touched"
          />
          <p *ngIf="email?.invalid && email?.touched" class="mt-1.5 text-xs text-red-600">
            {{ emailErrorMessage() }}
          </p>
        </div>

        <button
          type="submit" [disabled]="isSubmitting()"
          class="w-full flex items-center justify-center gap-2 rounded-lg bg-gray-800 py-2.5 text-sm font-semibold text-white
                 hover:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-800 focus:ring-offset-2
                 disabled:opacity-60 disabled:cursor-not-allowed transition"
        >
          <svg *ngIf="isSubmitting()" class="h-4 w-4 animate-spin text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          <span>{{ isSubmitting() ? 'Sending…' : 'Send reset link' }}</span>
        </button>

        <p class="text-center text-sm text-gray-500">
          <a routerLink="/login" class="font-medium text-gray-800 hover:text-gray-900">← Back to sign in</a>
        </p>
      </form>
    </div>
  </div>
</div>
